name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-file-picker

      - name: Prepare Flet Build Config & Android Permissions
        run: |
          cat << EOF > pyproject.toml
          [project]
          name = "carbapp"
          version = "1.0.0"
          description = "Smart Diabetes Management System"
          dependencies = ["flet", "flet-file-picker"]
          
          [tool.flet.app]
          module = "main"
          
          [tool.flet.app.android]
          permissions = ["camera", "read_external_storage", "write_external_storage", "read_media_images", "internet"]
          EOF

      - name: Build Android APK
        env:
          ORG_GRADLE_PROJECT_org.gradle.daemon: "false"
        # إيقاف حساسية الخادم تجاه الأنابيب، وضخ الموافقة بشكل مستمر وآمن
        run: |
          set +o pipefail
          yes | flet build apk -vv

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-app-apk
          path: build/apk/*.apk
