name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11 (البيئة الذهبية المستقرة لهذا الإصدار)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter 3.19.6 (الإصدار الإجباري لمحرك Flet)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Disable Analytics and Accept Licenses
        run: |
          flutter config --no-analytics
          yes | flutter doctor --android-licenses || true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.22.1

      - name: Prepare Flet Build Config & Android Permissions
        run: |
          cat << EOF > pyproject.toml
          [project]
          name = "carbapp"
          version = "1.0.0"
          description = "Smart Diabetes Management System"
          dependencies = ["flet==0.22.1"]
          
          [tool.flet.app]
          module = "main"
          
          [tool.flet.app.android]
          permissions = ["camera", "read_external_storage", "write_external_storage", "read_media_images"]
          EOF

      - name: Build Android APK
        env:
          ORG_GRADLE_PROJECT_org.gradle.daemon: "false"
          # إعلام المحرك أنه يعمل في خادم لمنعه من الأسئلة الخفية
          CI: "true"
        # قطع لوحة المفاتيح (/dev/null) لضمان عدم التعليق نهائياً
        run: flet build apk < /dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-app-apk
          path: build/apk/*.apk
