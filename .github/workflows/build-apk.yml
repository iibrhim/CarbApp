name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Flutter doctor & dependencies
        run: |
          flutter --version
          flutter doctor -v
          flutter config --no-analytics

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.22.1"

          # لو عندك google-genai في pyproject، هذا يضمن التثبيت
          # (لن يضر حتى لو كان موجود)
          if [ -f pyproject.toml ]; then
            pip install "google-genai"
          fi

      # (اختياري لكن موصى به) تمرير API key كـ secret بدل وضعه داخل main.py
      # ملاحظة: هذا يتطلب تعديل main.py ليستخدم env var بدل الثابت داخل الملف.
      - name: Export secrets (optional)
        if: ${{ secrets.GOOGLE_GENAI_API_KEY != '' }}
        run: |
          echo "GOOGLE_GENAI_API_KEY=${{ secrets.GOOGLE_GENAI_API_KEY }}" >> $GITHUB_ENV

      - name: Build Android APK
        env:
          ORG_GRADLE_PROJECT_org.gradle.daemon: "false"
          CI: "true"
        run: |
          # تشخيص بسيط
          python -V
          ls -la

          # بناء APK
          flet build apk -vv

          # التأكد من مكان ملفات APK
          echo "APK files found:"
          find . -type f -name "*.apk" -maxdepth 6 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-app-apk
          path: |
            build/apk/**/*.apk
            **/build/apk/**/*.apk
            **/*.apk
