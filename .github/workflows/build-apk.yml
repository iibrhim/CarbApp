name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. تثبيت Java 17 وتعيين متغير البيئة JAVA_HOME
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
        # هذا السطر هو المفتاح: يضمن أن جميع الخطوات التالية ستستخدم Java 17
        # حتى لو كانت هناك نسخ Java أخرى مثبتة على النظام.
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # هذا الخيار يتجاوز cmdline-tools الموجود مسبقاً ويجبر الأداة على تثبيت نسخة جديدة.
          # سيتم استخدام النسخة الجديدة التي ستستعمل Java 17 بشكل صحيح.
          cmdline-tools-version: 'latest'

      - name: Set up Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Disable Analytics
        run: flutter config --no-analytics

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.22.1

      - name: Prepare Flet Build Config & Android Permissions
        run: |
          cat << 'EOF' > pyproject.toml
          [project]
          name = "carbapp"
          version = "1.0.0"
          description = "Smart Diabetes Management System"
          dependencies = ["flet==0.22.1"]

          [tool.flet]
          org = "com.ibrahim.carbapp"
          product = "حاسبة الكارب الذكية"

          [tool.flet.app]
          module = "main"

          [tool.flet.app.android]
          permissions = [
            "camera",
            "read_external_storage",
            "write_external_storage",
            "read_media_images",
            "internet",
            "post_notifications",
            "schedule_exact_alarm",
            "use_exact_alarm",
            "vibrate"
          ]
          EOF

      - name: Build Android APK
        env:
          CI: "true"
          # التأكد من أن Gradle يستخدم Java 17 أيضاً
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true"
        run: flet build apk -vv

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-app-apk
          path: build/apk/*.apk
          if-no-files-found: error
