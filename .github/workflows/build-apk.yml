name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install flet google-genai

      - name: Prepare Flet Build Config & Android Permissions
        run: |
          cat << EOF > pyproject.toml
          [project]
          name = "carbapp"
          version = "1.0.0"
          description = "Smart Diabetes Management System"
          dependencies = ["flet", "google-genai"]
          
          [tool.flet.app]
          module = "main"
          
          [tool.flet.app.android]
          # حقن الصلاحيات الرسمية في قلب الأندرويد
          permissions = ["camera", "read_external_storage", "write_external_storage", "read_media_images"]
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build Android APK
        # الضربة القاضية: إجبار الخادم على دمج أداة الكاميرا ومعرض الصور
        run: flet build apk --include-packages flet_file_picker

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-app-apk
          path: build/apk/*.apk
