name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install flet google-genai

      - name: Prepare Flet Build Config
        run: |
          cat << EOF > pyproject.toml
          [project]
          name = "carbapp"
          version = "1.0.0"
          description = "Smart Diabetes Management System"
          dependencies = ["flet", "google-genai"]
          [tool.flet.app]
          module = "main"
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Build Android APK
        # أعدنا الإجابة التلقائية "نعم" ليتجاوز سؤال التحميل فوراً
        run: echo "y" | flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-app-apk
          path: build/apk/*.apk
