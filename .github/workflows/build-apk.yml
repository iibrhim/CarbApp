name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Packages
        # تم تصحيح الخطأ: إزالة flet-file-picker من هنا لأنه لا يحمل من الإنترنت
        run: |
          python -m pip install --upgrade pip
          pip install flet google-genai

      - name: Prepare Flet Build Config & Android Permissions
        # احتفظنا بها هنا فقط لأن هذا هو مكانها الصحيح لدمج الكاميرا
        run: |
          cat << EOF > pyproject.toml
          [project]
          name = "carbapp"
          version = "1.0.0"
          description = "Smart Diabetes Management System"
          dependencies = ["flet", "flet-file-picker", "google-genai"]
          
          [tool.flet.app]
          module = "main"
          
          [tool.flet.app.android]
          permissions = ["camera", "read_external_storage", "write_external_storage", "read_media_images"]
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (Exact Version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      - name: Build Android APK
        run: flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-app-apk
          path: build/apk/*.apk
