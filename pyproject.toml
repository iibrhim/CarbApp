[project]
name = "carbapp"
version = "1.0.0"
description = "Smart Diabetes Management System"
dependencies = [
    "flet",
    "google-genai"
]

[tool.flet]
org = "com.ibrahim.carbapp"
product = "حاسبة الكارب الذكية"

[tool.flet.app]
module = "main"

[tool.flet.app.android]
permissions = ["camera", "read_external_storage", "write_external_storage", "read_media_images"]