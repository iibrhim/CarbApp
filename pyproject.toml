[project]
name = "carbapp"
version = "1.0.0"
description = "Smart Diabetes Management System"
dependencies = [
    "flet==0.22.1"
]

[tool.flet]
org = "com.ibrahim.carbapp"
product = "حاسبة الكارب الذكية"
# ✅ تحديد إصدار Python المتوافق مع Flet 0.22.1
python_version = "3.11"

[tool.flet.app]
module = "main"

# ✅ شاشة تمهيدية لتجنب الشاشة البيضاء أثناء التحميل
[tool.flet.app.boot_screen]
show = true
message = "جاري تحضير التطبيق..."

[tool.flet.app.startup_screen]
show = true
message = "جاري تجهيز كل شيء..."

# ✅ الأذونات الصحيحة
[tool.flet.android]
permissions = [
    "camera",
    "read_external_storage",
    "write_external_storage",
    "read_media_images",
    "internet",
    "post_notifications",
    "schedule_exact_alarm",
    "use_exact_alarm",
    "vibrate"
]

# ✅ إعدادات إضافية للاتصال بالإنترنت
[tool.flet.android.manifest_application]
usesCleartextTraffic = "true"